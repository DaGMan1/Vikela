<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentry Dashboard</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --safe: #22c55e;
      --caution: #f59e0b;
      --danger: #ef4444;
      --primary: #667eea;
      --border-radius: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 260px;
      height: 100vh;
      background: var(--bg-secondary);
      border-right: 1px solid var(--bg-card);
      padding: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }

    .logo-text {
      font-size: 24px;
      font-weight: 700;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 4px;
      transition: background 0.2s;
      color: var(--text-secondary);
    }

    .nav-item:hover,
    .nav-item.active {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .main-content {
      margin-left: 260px;
      padding: 32px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--bg-secondary);
      border-radius: var(--border-radius);
      padding: 24px;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .stat-value.safe { color: var(--safe); }
    .stat-value.caution { color: var(--caution); }
    .stat-value.danger { color: var(--danger); }
    .stat-value.primary { color: var(--primary); }

    .stat-label {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .section {
      background: var(--bg-secondary);
      border-radius: var(--border-radius);
      padding: 24px;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .search-box:focus {
      outline: none;
      border-color: var(--primary);
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: var(--bg-card);
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .contact-item:hover {
      transform: translateX(4px);
    }

    .contact-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 18px;
    }

    .contact-info {
      flex: 1;
    }

    .contact-name {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .contact-email {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .contact-meta {
      text-align: right;
    }

    .contact-score {
      font-size: 20px;
      font-weight: 700;
    }

    .contact-score.safe { color: var(--safe); }
    .contact-score.caution { color: var(--caution); }
    .contact-score.danger { color: var(--danger); }

    .contact-count {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    @media (max-width: 1200px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">S</div>
      <div class="logo-text">Sentry</div>
    </div>
    
    <nav>
      <div class="nav-item active">
        <span>📊</span> Dashboard
      </div>
      <div class="nav-item">
        <span>👥</span> Contacts
      </div>
      <div class="nav-item">
        <span>🛡️</span> Security
      </div>
      <div class="nav-item">
        <span>📧</span> Email History
      </div>
      <div class="nav-item">
        <span>⚙️</span> Settings
      </div>
    </nav>
  </aside>

  <main class="main-content">
    <div class="header">
      <h1>Dashboard</h1>
      <button class="btn btn-primary" id="btn-scan">🔄 Scan Gmail</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value primary" id="stat-total">0</div>
        <div class="stat-label">Total Contacts</div>
      </div>
      <div class="stat-card">
        <div class="stat-value safe" id="stat-safe">0</div>
        <div class="stat-label">Verified Safe</div>
      </div>
      <div class="stat-card">
        <div class="stat-value caution" id="stat-caution">0</div>
        <div class="stat-label">Caution</div>
      </div>
      <div class="stat-card">
        <div class="stat-value danger" id="stat-danger">0</div>
        <div class="stat-label">Suspicious</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        <span>Recent Contacts</span>
        <button class="btn btn-primary" onclick="viewAllContacts()">View All</button>
      </div>
      <input type="text" class="search-box" id="search-contacts" placeholder="Search contacts...">
      <div id="contacts-list" class="contact-list">
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <p>No contacts yet. Open Gmail to start scanning.</p>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">
        <span>⚡ Quick Actions</span>
      </div>
      <div style="display: flex; gap: 12px;">
        <button class="btn btn-primary" onclick="importGoogleContacts()">📥 Import Google Contacts</button>
        <button class="btn btn-primary" onclick="exportData()">📤 Export Data</button>
        <button class="btn" style="background: var(--bg-card); color: var(--text-primary);" onclick="clearAllData()">🗑️ Clear All Data</button>
      </div>
    </div>
  </main>

  <script>
    // Load stats
    async function loadStats() {
      try {
        chrome.runtime.sendMessage({ type: 'GET_STATS' }, (response) => {
          if (response.success) {
            document.getElementById('stat-total').textContent = response.stats.totalContacts;
            document.getElementById('stat-safe').textContent = response.stats.highTrust;
            document.getElementById('stat-caution').textContent = response.stats.mediumTrust;
            document.getElementById('stat-danger').textContent = response.stats.lowTrust;
          }
        });
      } catch (error) {
        console.error('Error loading stats:', error);
      }
    }

    // Load recent contacts
    async function loadContacts() {
      try {
        chrome.runtime.sendMessage({ type: 'GET_ALL_CONTACTS' }, (response) => {
          if (response.success && response.contacts.length > 0) {
            displayContacts(response.contacts.slice(0, 10));
          }
        });
      } catch (error) {
        console.error('Error loading contacts:', error);
      }
    }

    function displayContacts(contacts) {
      const listEl = document.getElementById('contacts-list');
      
      if (contacts.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <p>No contacts yet. Open Gmail to start scanning.</p>
          </div>
        `;
        return;
      }

      listEl.innerHTML = contacts.map(contact => {
        const score = contact.trustScore || 0;
        const scoreClass = score >= 70 ? 'safe' : score >= 30 ? 'caution' : 'danger';
        const initials = contact.name 
          ? contact.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2)
          : contact.email[0].toUpperCase();
        
        return `
          <div class="contact-item" onclick="viewContact('${contact.email}')">
            <div class="contact-avatar">${initials}</div>
            <div class="contact-info">
              <div class="contact-name">${contact.name || contact.email.split('@')[0]}</div>
              <div class="contact-email">${contact.email}</div>
            </div>
            <div class="contact-meta">
              <div class="contact-score ${scoreClass}">${score}%</div>
              <div class="contact-count">${contact.interactionCount || 0} emails</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Search functionality
    document.getElementById('search-contacts').addEventListener('input', (e) => {
      const query = e.target.value;
      if (query.length < 2) return;
      
      chrome.runtime.sendMessage({ 
        type: 'SEARCH_CONTACTS', 
        data: { query } 
      }, (response) => {
        if (response.success) {
          displayContacts(response.results);
        }
      });
    });

    // Scan button
    document.getElementById('btn-scan').addEventListener('click', () => {
      chrome.runtime.sendMessage({ type: 'SCAN_GMAIL_MESSAGES' }, () => {
        alert('Gmail scan started! Check the side panel for updates.');
      });
    });

    // Action functions
    function viewAllContacts() {
      alert('Full contact list coming in Phase 2!');
    }

    function viewContact(email) {
      alert(`Viewing contact: ${email}\nFull contact details coming in Phase 2!`);
    }

    function importGoogleContacts() {
      alert('Google Contacts import coming in Phase 2!');
    }

    function exportData() {
      alert('Data export coming in Phase 2!');
    }

    function clearAllData() {
      if (confirm('Are you sure you want to delete all Sentry data? This cannot be undone.')) {
        chrome.runtime.sendMessage({ type: 'CLEAR_ALL_DATA' }, () => {
          loadStats();
          loadContacts();
          alert('All data cleared!');
        });
      }
    }

    // Initialize
    loadStats();
    loadContacts();
  </script>
</body>
</html>
